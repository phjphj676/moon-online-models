name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: moon check
        run: moon check
      - name: moon fmt
        run: moon fmt --deny-warn
      - name: moon info
        run: moon info --deny-warn
      - name: moon test
        run: moon test
