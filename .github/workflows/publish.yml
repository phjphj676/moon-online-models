name: Publish to Mooncakes

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install-moonbit-stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: prepublish check
        run: |
          moon version --all
          moon update
          moon check --target all
          moon test --target all
      - name: publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "MOONCAKES_MOONBIT_COMMUNITY_TOKEN is not configured"
            exit 1
          fi
          printf '%s' "$MOONCAKES_TOKEN" > ~/.moon/credentials.json
          moon publish
          rm -f ~/.moon/credentials.json
